name: Static harness validation
on:
  push:
  pull_request:

jobs:
  prompt-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check prompt and harness syntax
        run: python -m unittest discover -s tests -v
